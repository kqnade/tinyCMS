[tools]
node = "24.19.0"
pnpm = "11.24.0"
"npm:wrangler" = "4.127.1"

[tasks.install]
description = "Install the locked workspace dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.check]
description = "Run all repository checks"
run = "pnpm check"

[tasks.dev]
description = "Run all development applications"
depends = ["dev:migrate"]
run = "pnpm dev"

[tasks."dev:migrate"]
description = "Apply local Admin D1 migrations"
run = "pnpm --dir apps/admin-worker exec wrangler d1 migrations apply CMS_DB --local"
